[detour]
; How to connect. "auto" (the default) finds proxy apps running on this
; computer (v2rayN, Hiddify, Throne, Clash/mihomo, sing-box, Cloudflare WARP
; and others), races them against a direct connection and uses the fastest.
;
; You can also list your own proxies, separated by commas, and the fastest
; working one is used. "auto" can be mixed in:
;   proxy = socks5://127.0.0.1:1080
;   proxy = auto, http://user:password@proxy.example.com:3128
;   proxy = off        (never use a proxy)
proxy = auto

; Which app the "detour" command starts: auto, vesktop, discord, discord-ptb,
; discord-canary. Menu icons always start their own app.
app = auto
